[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sql-query-parser"
version = "0.2.0"
description = "A hand-written SQL lexer and parser producing a typed AST for a documented SQL subset."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Juan Martos Cuevas", email = "martoscuevasjuan@gmail.com" }]

[project.urls]
Repository = "https://github.com/juanmmm21/sql-query-parser"

[project.scripts]
sql-query-parser = "sql_query_parser.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "mypy>=1.10", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/sql_query_parser"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "N"]
